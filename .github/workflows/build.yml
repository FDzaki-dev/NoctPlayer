name: Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Generate gradlew if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          fi

      - name: Decode keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: set -euo pipefail; ./gradlew assembleRelease --stacktrace

      - name: Read version name
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/[^0-9.]//g')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Rename APK output
        run: |
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          NEW_NAME="NoctPlayer-v${VERSION}-release.apk"
          NEW_PATH="app/build/outputs/apk/release/$NEW_NAME"
          mv "$RAW_APK" "$NEW_PATH"
          echo "APK_PATH=$NEW_PATH" >> $GITHUB_ENV
          echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          echo "APK: $APK_PATH"
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify --verbose "$APK_PATH" | tee verify.txt
          sha256sum "$APK_PATH" | tee -a verify.txt
          echo "## APK Verification ($APK_NAME)" >> $GITHUB_STEP_SUMMARY
          cat verify.txt >> $GITHUB_STEP_SUMMARY

      - name: Publish GitHub Release with APK asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-${{ github.run_number }}
          name: NoctPlayer v${{ env.VERSION }} (build ${{ github.run_number }})
          files: ${{ env.APK_PATH }}
          generate_release_notes: true
